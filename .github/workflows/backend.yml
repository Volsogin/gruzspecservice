name: backend

# Runs when the backend, the Docker setup or the frontend (it is built into the same image) changes.
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "docker-compose*.yml", ".dockerignore", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose*.yml", ".dockerignore", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts
      - run: uv run pytest -q

  compose:
    name: docker compose up + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL + API
        run: docker compose up -d --build
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/healthz && exit 0; sleep 2; done
          docker compose logs api; exit 1
      - name: Smoke test
        run: |
          set -euo pipefail
          B=http://localhost:8000/api/v1
          curl -sf http://localhost:8000/readyz | tee /dev/stderr | grep -q '"database":true'
          curl -sf $B/bootstrap | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['services']) >= 6"
          LEAD=$(curl -sf -X POST $B/leads -H 'Content-Type: application/json' -d '{"lead_type":"callback","name":"CI","phone":"+7 900 000-00-00","consent":true}')
          TOKEN=$(echo "$LEAD" | python3 -c "import json,sys; print(json.load(sys.stdin)['public_token'])")
          curl -sf $B/orders/$TOKEN | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status'] == 'new', d"
          curl -sf -X POST $B/calculator/estimate -H 'Content-Type: application/json' -d '{"brand":"MAN","work_type":"diagnostics"}' | grep -q price_from
          # the site is served by the same container (SPA fallback for client routes)
          curl -sf http://localhost:8000/ | grep -q 'id="root"'
          curl -sf http://localhost:8000/order/$TOKEN | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/nope)" = 404
      - name: Production override is valid
        run: |
          DOMAIN=example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          DOMAIN=example.com COMPOSE_PROFILES=proxy docker compose -f docker-compose.yml -f docker-compose.prod.yml config --services | grep -qx proxy
          python3 deploy/proxy-config.py 'vless://11111111-2222-3333-4444-555555555555@vpn.example.com:443?type=xhttp&security=tls&path=%2Fx#ci'
          docker run --rm -v "$PWD/deploy/xray/config.json:/etc/xray/config.json:ro" ghcr.io/xtls/xray-core:26.10.31 run -test -c /etc/xray/config.json
      - name: Restart keeps data (migrations + seed are idempotent)
        run: |
          docker compose restart api
          for i in $(seq 1 60); do curl -sf http://localhost:8000/healthz && break; sleep 2; done
          curl -sf "http://localhost:8000/api/v1/reviews?limit=50" | python3 -c "import json,sys; assert json.load(sys.stdin)['total'] == 10"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
