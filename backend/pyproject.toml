[project]
name = "gruzspecservice-backend"
version = "0.1.0"
description = "Backend API for the GRUZSPECSERVICE truck service website (hackathon)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "httpx[socks]>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "pyyaml>=6.0",
    "sqladmin>=0.18",
    "itsdangerous>=2.2",
    "brotli>=1.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pre-commit>=3.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PL"]
ignore = [
    "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915",
    "ASYNC109",  # explicit httpx timeouts are passed through on purpose
    "RUF001", "RUF002", "RUF003",  # cyrillic letters in strings/comments are intentional
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B"]
"scripts/**" = ["T20", "ASYNC"]  # interactive CLI tools
"app/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["sqladmin.*", "pillow_heif.*", "brotli.*", "wtforms.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:sqladmin.*"]
